<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Up — anglais oral pro</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">

<meta name="theme-color" content="#1f2328">
</head>
<body>
<header class="top">

    <button data-view="quick">⚡ Réponse rapide</button>
    <button data-view="expr">📚 Expressions</button>
    <button data-view="settings">⚙️ Réglages</button>

<main id="view"></main>
<div id="toast" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
